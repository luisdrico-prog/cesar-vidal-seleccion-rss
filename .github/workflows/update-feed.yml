name: Actualizar RSS César Vidal Selección

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"
  push:
    branches: ["main"]
    paths:
      - "update_feed.py"
      - "requirements.txt"
      - ".github/workflows/update-feed.yml"

permissions:
  contents: write

concurrency:
  group: cesar-vidal-seleccion-rss
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt

      - name: Generar catálogo filtrado y RSS
        run: python update_feed.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml catalog.json backfill_state.json
          if git diff --cached --quiet; then
            echo "No hay cambios"
          else
            git commit -m "Actualizar César Vidal: Editorial, Despegamos y Así fue España"
            git push
          fi
